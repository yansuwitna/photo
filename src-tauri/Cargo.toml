[package]
name = "photobooth-pro"
version = "1.0.0"
description = "PHOTOBOOTH PRO Desktop Kiosk & Hardware Bridge"
authors = ["PHOTOBOOTH PRO Team"]
license = "Proprietary"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0.0", features = [] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }